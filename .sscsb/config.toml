# SSCS Bootstrapper configuration — the single source of truth for which
# controls are enabled. Every control is independently toggleable here;
# no code changes required. Secure defaults are ON; optional integrations
# that need external services or extra tooling are OFF.
#
# Toggle:   sscsb enable <control> | sscsb disable <control>
# Inspect:  sscsb status | sscsb verify | sscsb report

[general]
# Branches where human-only signing and merge policy are enforced.
protected_branches = ["main", "master"]
# fail_open = true would let hooks pass when scanners are missing. Keep false.
fail_open = false
github_repo = "p4gs/sscs-bootstrapper"

# ── Phase 1 — Local source integrity ──

# Secret scanning hooks: TruffleHog + Gitleaks block secrets at pre-commit and pre-push
[controls.secrets]
enabled = true
trufflehog = true
gitleaks = true
pre_push_range_scan = true

# CommitSigningGuard: human-only signing enforced on protected branches at pre-push.
# require_hardware_backed relaxed 2026-08-09 (principal decision, applies to all
# repos) to admit a 1Password-vaulted SSH key (software-backed, not a physical
# security key) — 1Password is the standing SSH-signing-key store going forward.
[controls.commit-signing]
enabled = true
require_hardware_backed = false
require_review_evidence_for_ai_merges = true

# Branch protection verification: Verify GitHub protected-branch rules (PRs, no force-push, signatures, checks)
[controls.branch-protection]
enabled = true

# Actions pinning & permissions audit: Flag mutable action refs and missing/over-broad workflow permissions
[controls.actions-audit]
enabled = true

# AI commit trailers: Validate AI-Assisted / AI-Tool / AI-Model / AI-Role commit trailers
[controls.ai-trailers]
enabled = true

# AI dependency & command gate: Extra gating when AI-assisted commits add dependencies or shell commands
[controls.ai-dep-gate]
enabled = true

# AI-provenance PR template: PR template asking whether AI generated code/tests/dependencies/docs
[controls.pr-template]
enabled = true

# AI provenance receipts: Optional cryptographic receipts linking commits to AI tool/model/role
[controls.ai-receipts]
enabled = true
sign_with_cosign = true

# ── Phase 2 — Dependency & vulnerability visibility ──

# SBOM generation: Syft SBOM in CycloneDX (default) or SPDX JSON
[controls.sbom]
enabled = true
format = "cyclonedx-json"

# Vulnerability scanning: Trivy (vuln+secret+misconfig) and OSV-Scanner V2 (lockfile-exact)
[controls.vuln-scan]
enabled = true
fail_on = "high"

# OpenSSF Scorecard: Scorecard workflow scoring repository security posture
[controls.scorecard]
enabled = true

# Renovate onboarding: Automated dependency updates with digest pinning + lockfile maintenance
[controls.renovate]
enabled = true

# Package trust gate: Existence validation, human approval for new packages, typosquat heuristics, lockfile-exact installs
[controls.package-trust]
enabled = true
registry_check = true
typosquat_check = true

# Grype (optional): SBOM-first vulnerability scanning where Syft+Grype is preferred.
# Enabled 2026-09-01 (max-hardening pass): second engine over the same SBOM —
# deliberate redundancy with Trivy, not a replacement.
[controls.grype]
enabled = true

# Socket Firewall (optional): Malicious-package detection/blocking at install time
[controls.socket-firewall]
enabled = true

# ── Phase 3 — Provenance, signing & credential federation ──

# Sigstore keyless signing: Cosign keyless signing + SBOM/provenance attestations bound to digests
# IMPLEMENTED in the consolidated release.yml (draft-then-publish): `cosign sign-blob
# --bundle` over every shipped tarball, before publish, via a SHA-pinned
# sigstore/cosign-installer in a job granted `id-token: write`. The modular
# release-sign.yml is deliberately NOT installed (it uploads signatures AFTER
# publish, which release immutability forbids); the scanner's consolidated-evidence
# recognition verifies the step in release.yml and reports that file as the evidence.
[controls.sigstore-signing]
enabled = true

# SLSA Build L3 provenance: IMPLEMENTED in the consolidated release.yml. The earlier
# note here ("the generator attaches provenance after publish, incompatible with
# immutability") was wrong: the generic generator can emit the provenance as a RUN
# ARTIFACT (`upload-assets: false`), and the draft-then-publish flow uploads that
# *.intoto.jsonl to the DRAFT with the other assets before the single publish. The
# `provenance` job calls slsa-framework/slsa-github-generator's generic_slsa3 reusable
# workflow at a vX.Y.Z tag (the one sanctioned pinning exception) over the sha256
# subjects the release job computed, granted `actions: read` + `id-token: write` +
# `contents: write`; deploy-gate.yml verifies it with slsa-verifier before publish.
# The modular release-slsa.yml is NOT installed (it attaches after publish). The
# scanner's consolidated-evidence recognition verifies the job in release.yml.
[controls.slsa-provenance]
enabled = true

# GitHub artifact attestations: IMPLEMENTED in the consolidated release.yml —
# `actions/attest-build-provenance` (SHA-pinned, `subject-path` = the shipped tarballs)
# writes build provenance to GitHub's attestation store from a job granted
# `attestations: write` + `id-token: write`. The modular release-attest.yml is NOT
# installed on purpose: it would attest a separately-rebuilt archive, i.e. a different
# digest. Verified in release.yml by the scanner's consolidated-evidence recognition.
[controls.github-attestations]
enabled = true

# GitHub SBOM attestation: IMPLEMENTED in the consolidated release.yml — anchore/sbom-action
# generates the CycloneDX SBOM and `actions/attest` (SHA-pinned, `sbom-path`) binds it to
# the digest of the artifact actually shipped, in the same attestation-granted job. The
# modular release-attest-sbom.yml is NOT installed (same different-digest reason as
# github-attestations). Verified in release.yml by consolidated-evidence recognition.
[controls.sbom-attestation]
enabled = true

# Provenance verification gates: slsa-verifier + cosign verification required before promote/deploy/publish.
# deploy-gate.yml is a `workflow_call` reusable gate that release.yml runs between its
# provenance and publish jobs (checksums, Cosign bundles against this workflow's identity at
# the tag, `gh attestation verify` for build provenance + SBOM, slsa-verifier against the
# pinned builder); `workflow_dispatch` with a tag re-verifies an already-published release.
[controls.provenance-verify]
enabled = true
# The trusted builder `sscsb provenance verify` pins (--builder-id default). It MUST
# track the slsa-github-generator tag release.yml's `provenance` job calls and the
# BUILDER_ID deploy-gate.yml verifies against — change one, change all three.
builder_id = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0"

# Immutable releases (draft-then-publish): supersedes the modular release-sign/slsa flow.
# Consolidated release.yml: build → checksum, attest build-provenance + SBOM to the store,
# Cosign sign → SLSA generator (run artifact) → deploy-gate verifies everything → upload
# to a DRAFT, confirm the draft's bytes → publish once, so nothing changes after the
# release is immutable.
[controls.release-immutability]
enabled = true

# Octo STS federation: Short-lived repo-scoped GitHub credentials replacing long-lived PATs
[controls.octo-sts]
enabled = true

# Harden-Runner: StepSecurity Harden-Runner egress/tamper monitoring in every workflow
[controls.harden-runner]
enabled = true

# Witness (optional): Richer in-toto attestation capture and policy around build steps.
# OFF (documented, max-hardening pass 2026-09-01): binary not installed, and
# release.yml's attestation-store path already binds build provenance + SBOM to
# the shipped digests — per-step in-toto capture adds forensic replay this
# 3-target build does not need. Revisit if the build pipeline grows stages.
[controls.witness]
enabled = false

# ── Phase 4 — Deeper code security & CI hardening ──

# SAST (OpenGrep default): OpenGrep rule-driven SAST in pre-commit and CI; Semgrep selectable
[controls.sast]
enabled = true
engine = "opengrep"
pre_commit = false
rules = ".sscsb/rules"

# Sighthound (optional): Ultra-fast local pre-commit SAST layer.
# OFF (documented 2026-09-01): binary not installed; OpenGrep covers pre-commit
# + CI SAST and the pre-commit path is already fast on this codebase.
[controls.sighthound]
enabled = false

# CodeQL: Deep interprocedural analysis on PRs and default branch
[controls.codeql]
enabled = true

# ClusterFuzzLite fuzzing: continuous fuzzing on PRs (cargo-fuzz + ClusterFuzzLite) — the OpenSSF-Scorecard Rust fuzzing probe; opt-in (needs project fuzz targets)
# sscs-bootstrapper dogfoods this: it has fuzz/ targets + .clusterfuzzlite/.
[controls.fuzzing]
enabled = true

# Extended workflow audit: pull_request_target misuse, credential persistence, secret echo, risky actions
[controls.workflow-audit-extended]
enabled = true

# StepSecurity secure-repo: Onboarding accelerator via app.stepsecurity.io (web service, not an action)
[controls.secure-repo]
enabled = true

# wait-for-secrets (optional): Human-in-the-loop secret injection for high-sensitivity workflows.
# OFF (documented 2026-09-01): every credentialed step is keyless (Fulcio OIDC /
# octo-sts) — there is no long-lived secret left for a human to inject.
[controls.wait-for-secrets]
enabled = false

# ── Phase 5 — Observability & governance ──

# Dependency-Track: Continuous SBOM management platform (self-hosted); sscsb uploads BOMs.
# OFF (documented 2026-09-01): a standing service sized for fleets; this repo's
# vuln exposure is re-scanned on every CI run and release. Owner infra decision
# if the estate ever wants cross-repo SBOM history.
[controls.dependency-track]
enabled = false
url = ""
project_name = ""

# GUAC ingestion: Supply-chain knowledge graph over SBOMs, attestations, and VEX.
# OFF (documented 2026-09-01): another standing service; one repo's graph is
# readable straight from the SBOM. Same owner-infra revisit condition as
# dependency-track.
[controls.guac]
enabled = false

# OpenVEX: Generate and ingest VEX for exploitability-aware triage
[controls.openvex]
enabled = true

# ORAS OCI storage (optional): Push SBOMs/attestations to an OCI registry as reference artifacts.
# OFF (documented 2026-09-01): sscsb ships tarballs via GitHub Releases + Homebrew,
# no OCI image exists for referrers to attach to.
[controls.oras]
enabled = false

# Compliance map & report: Machine-readable control → SLSA/SSDF/CRA/Badge map behind `sscsb report`
[controls.compliance-map]
enabled = true

# Bumblebee endpoint exposure scan: known-compromised packages, MCP servers,
# extensions and agent skills on THIS machine (the surface the 2024-2026 worm
# campaigns actually landed on). Catalog = brew's stable opt symlink to the
# threat_intel set the package ships (glassworm, mini-shai-hulud, nx-console…);
# macOS/brew-specific by nature — on a machine without it the control reports
# the missing catalog visibly rather than silently passing.
[controls.bumblebee]
enabled = true
profile = "baseline"
catalog = "/opt/homebrew/opt/bumblebee/share/bumblebee/threat_intel"

