# sscsb: SBOM generation (Syft via anchore/sbom-action, CycloneDX JSON).
name: SBOM
on:
  push:
    branches: ["main"]
  release:
    types: [published]

permissions: {}

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
          upload-release-assets: false
      - name: Upload SBOM artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  attach-sbom:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the exact SBOM to this release
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Require the generation job's artifact ID
        shell: bash
        env:
          SBOM_ARTIFACT_ID: ${{ needs.sbom.outputs.artifact-id }}
        run: |
          if [[ ! "$SBOM_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::SBOM generation did not provide an artifact ID"
            exit 1
          fi
      - name: Download the SBOM from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sbom.outputs.artifact-id }}
          path: release-sbom
          merge-multiple: true
      - name: Attach CycloneDX SBOM to the published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          asset=release-sbom/sbom.cdx.json
          if [[ -z "$RELEASE_TAG" || ! -f "$asset" || -L "$asset" || ! -s "$asset" ]]; then
            echo "::error::Missing release tag or generated SBOM"
            exit 1
          fi
          gh release upload --clobber -- "$RELEASE_TAG" "$asset"
