# sscsb: immutability-compatible release (draft-then-publish). Builds the
# artifact set, then over the EXACT tarballs it ships:
#
#   build      → the build fan-out (the `sscsb:customize` region below),
#                handed on as run artifacts
#   release    → collects them, checksums centrally, attests build provenance
#                + the CycloneDX SBOM to GitHub's OWN attestation store
#                (immutability-safe — the store is separate from release
#                assets), keyless-signs every file (Cosign bundle = cert + sig
#                + Rekor proof), and emits the sha256 subjects for the SLSA
#                generator
#   provenance → slsa-framework/slsa-github-generator (SLSA Build L3, isolated
#                trusted builder) over those subjects, emitted as a RUN
#                ARTIFACT (`upload-assets: false`) — it never touches the
#                release itself, so the intoto file can travel to the DRAFT
#                below like any other asset instead of being attached after
#                publish (which immutability forbids)
#   gate       → .github/workflows/deploy-gate.yml (reusable): re-checks the
#                checksums, verifies every Cosign bundle against THIS
#                workflow's identity at THIS tag, verifies both store
#                attestations, and verifies the SLSA provenance with
#                slsa-verifier against the pinned builder. Publish is
#                unreachable unless it passes.
#   publish    → uploads the verified set + provenance to a DRAFT release,
#                confirms the draft holds exactly the verified bytes, then
#                publishes ONCE, so nothing is modified after the release
#                becomes immutable.
#
# Enable "release immutability" (Settings -> General -> Releases) alongside
# this. The first tag pushed after this workflow lands is its first real run;
# every gate is fail-closed by design, so a defect surfaces as a failed run
# with an unpublished draft, never as a published release missing evidence.
#
# PINNING EXCEPTION (deliberate, audited): slsa-github-generator MUST be
# referenced by @vX.Y.Z tag — slsa-verifier validates the trusted builder's
# ref and the build fails on SHA or short-tag refs (upstream README;
# slsa-verifier issue #12). Every other action here is SHA-pinned.
#
# Build fan-out: each target is built on a runner that can produce it, then the
# single `release` job collects every tarball and performs ALL release writes.
# Checksums are computed centrally in that job rather than per-runner, so the
# digests users verify are produced by one tool on one platform (macOS has no
# `sha256sum`; a per-runner split would mean two implementations).
#
# The two `sscsb:customize-*` regions are the ONLY repository-specific parts:
# the build job (what gets built, on what) and the tarball count it yields.
# Everything else is shared verbatim between the template sscsb ships and
# sscsb's own release pipeline — a test in the sscsb repository holds the two
# in byte parity.
name: Release (immutable)
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # sscsb:customize-begin build — one job per artifact set. Whatever this job
  # uploads as dist/*.tar.gz under a `build-*` artifact name is what the
  # `release` job below collects, checksums, attests, signs and ships.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true # never publish a partial platform set
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The runner ships a stable Rust toolchain; --locked pins to the committed
      # lockfile. `rustup target add` is a no-op for a runner's native target and
      # supplies the std for the one cross case (x86_64 macOS from an arm64 host,
      # which Xcode's bundled SDKs support directly).
      - name: Add target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build sscsb release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET"
          mkdir -p dist
          tar -C "target/${TARGET}/release" -czf "dist/sscsb-${GITHUB_REF_NAME}-${TARGET}.tar.gz" sscsb
      - name: Verify the tarball contains a runnable binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tar -tzf "dist/sscsb-${GITHUB_REF_NAME}-${TARGET}.tar.gz" | grep -qx sscsb \
            || { echo "::error::tarball for $TARGET has no sscsb entry"; exit 1; }
          # Only the host-native artifact can be executed here; a cross-built one
          # is checked structurally above. Never claim more than was proven.
          if [ "$TARGET" = "$(rustc -vV | awk '/^host:/{print $2}')" ]; then
            "target/${TARGET}/release/sscsb" --version
          else
            echo "::notice::$TARGET is cross-built on this runner; skipping execution check"
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1
  # sscsb:customize-end build

  release:
    name: checksum, attest & sign
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless signing + attestation (Fulcio/Sigstore OIDC)
      attestations: write # write build-provenance + SBOM to the attestation store
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Collect built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: build-*
          merge-multiple: true
      # sscsb:customize-begin artifact-count — a partial set is a failed
      # release, not a small one: a formula pinned to a missing asset installs
      # nothing, and `fail-fast` above should already have stopped us. Assert
      # the exact count the build fan-out yields; `publish` re-asserts it.
      - name: Refuse to release an incomplete artifact set
        id: set
        run: |
          set -uo pipefail
          shopt -s nullglob
          artifacts=(dist/*.tar.gz)
          if [ ${#artifacts[@]} -ne 3 ]; then
            echo "::error::expected 3 platform tarballs, found ${#artifacts[@]}: ${artifacts[*]:-none}"
            exit 1
          fi
          printf '%s\n' "${artifacts[@]}"
          echo "count=${#artifacts[@]}" >> "$GITHUB_OUTPUT"
      # sscsb:customize-end artifact-count
      - name: Compute checksums
        run: |
          set -euo pipefail
          cd dist
          for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          cat ./*.sha256
      # The generator's subjects: one `sha256sum` line per shipped tarball,
      # base64-encoded on one line — the generic generator's documented recipe.
      # Computed from the SAME bytes that are checksummed, attested and signed
      # below, so all four trails describe one artifact set.
      - name: Compute SLSA subject hashes
        id: hash
        run: |
          set -euo pipefail
          cd dist
          echo "hashes=$(sha256sum -- *.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (attestation store)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.tar.gz
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json
          upload-release-assets: false
      - name: Attest the SBOM to the artifact digest (attestation store)
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/sbom.cdx.json
      # Every artifact must sign, or the step fails — a signing failure on ANY
      # file must never let an unsigned asset reach the published (immutable)
      # release. (`|| exit 1` per-file, not the loop's last-iteration status.)
      - name: Keyless sign all artifacts (bundle = cert + sig + Rekor proof)
        run: |
          set -uo pipefail
          shopt -s nullglob
          for f in dist/*; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob "$f" --bundle "$f.sigstore.json" --yes \
              || { echo "::error::signing failed for $f"; exit 1; }
          done
      # Hand the exact bytes to the gate and the publisher through the run's
      # artifact store; neither job rebuilds anything.
      - name: Upload the release set for the gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-set
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # SLSA Build L3 provenance from the isolated trusted builder, over the
  # subjects the `release` job hashed. `upload-assets: false` keeps the
  # generator off the release: the provenance is a run artifact that `gate`
  # verifies and `publish` uploads to the DRAFT — before, not after, publish.
  provenance:
    name: SLSA provenance (generator)
    needs: release
    permissions:
      actions: read # read the calling run's metadata
      id-token: write # sign the provenance (Fulcio)
      contents: write # the generator's declared ceiling; it uploads nothing here
    # Tag-pinned BY DESIGN — see header comment.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: false

  # The verification gate is the repository's ONE provenance-verify
  # implementation (deploy-gate.yml), called as a reusable workflow so the
  # checks that guard publishing are the checks anyone can read there.
  gate:
    name: verify before publish
    needs: [release, provenance]
    permissions:
      contents: read # read the run's artifacts + the attestation store; nothing else
    uses: ./.github/workflows/deploy-gate.yml
    with:
      artifact-name: release-set
      provenance-artifact: ${{ needs.provenance.outputs.provenance-name }}
      tag: ${{ github.ref_name }}

  publish:
    name: publish immutable release
    needs: [release, provenance, gate] # the gate: publish is unreachable unless verify succeeded
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/publish the release + upload assets to the draft
    env:
      # The release job counted the set it checksummed, attested and signed;
      # the draft must hold exactly that many tarballs, however many the build
      # fan-out produces.
      EXPECTED_TARBALLS: ${{ needs.release.outputs.count }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Collect the verified release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-set
          path: dist
      - name: Collect the verified SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist
      # A partial set is a failed release, not a small one: every tarball the
      # release job counted, their checksums, the SBOM, one bundle per signed
      # file, and the provenance must all be present. The *.intoto.jsonl is a
      # DSSE envelope the generator signed and the gate verified with
      # slsa-verifier; it is the one file that legitimately carries no Cosign
      # bundle.
      - name: Refuse to publish an incomplete release set
        run: |
          set -uo pipefail
          shopt -s nullglob
          cd dist
          fail=0
          tarballs=(*.tar.gz)
          [ ${#tarballs[@]} -eq "$EXPECTED_TARBALLS" ] || { echo "::error::expected ${EXPECTED_TARBALLS} tarballs, found ${#tarballs[@]}"; fail=1; }
          provenance=(*.intoto.jsonl)
          [ ${#provenance[@]} -ge 1 ] || { echo "::error::no *.intoto.jsonl provenance in the set"; fail=1; }
          [ -s sbom.cdx.json ] || { echo "::error::sbom.cdx.json missing from the set"; fail=1; }
          for t in "${tarballs[@]}"; do
            [ -s "$t.sha256" ] || { echo "::error::${t} has no .sha256 sidecar"; fail=1; }
          done
          for f in *; do
            case "$f" in *.sigstore.json|*.intoto.jsonl) continue ;; esac
            [ -s "$f.sigstore.json" ] || { echo "::error::${f} has no Cosign bundle"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
          ls -l
      # Draft-then-publish: EVERY asset write happens while the release is a
      # DRAFT (still mutable); the final publish is the only immutable transition.
      - name: Create draft release and upload all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Re-run guard: an already-PUBLISHED (immutable) release cannot be
          # modified — exit cleanly instead of failing at the upload step.
          if gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null | grep -qx false; then
            echo "::notice::$GITHUB_REF_NAME is already published (immutable) — nothing to upload"
            exit 0
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes \
            || { echo "::error::failed to create draft release for $GITHUB_REF_NAME"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      # The gate certified the bytes in the run's artifact store. Before the
      # release becomes immutable, prove the DRAFT holds exactly those bytes —
      # every file, no more, no less — by downloading it back and comparing.
      - name: Confirm the draft holds exactly the verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rm -rf check && mkdir -p check
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir check \
            || { echo "::error::could not download the draft's assets back"; exit 1; }
          expected="$(cd dist && shopt -s nullglob && set -- * && echo "$#")"
          actual="$(cd check && shopt -s nullglob && set -- * && echo "$#")"
          if [ "$expected" -ne "$actual" ]; then
            echo "::error::draft holds ${actual} asset(s), the verified set has ${expected}"
            exit 1
          fi
          (cd dist && sha256sum ./*) > expected.sum
          (cd check && sha256sum -c ../expected.sum) \
            || { echo "::error::draft assets differ from the verified set"; exit 1; }
      - name: Publish (assets + tag become immutable now)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft | grep -qx false; then
            echo "::notice::$GITHUB_REF_NAME is already published"
            exit 0
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
